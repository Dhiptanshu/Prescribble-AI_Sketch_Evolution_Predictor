# Continuous integration: the same commands the project documents (docs/DEVELOPMENT.md), on a clean Ubuntu machine for every push and pull request.
# Not yet run on GitHub (the repository has no remote); every job's commands were run locally first. See docs/DEPLOY.md.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt }
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: apps/api

  ml:
    name: ML and flywheel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt }
      - run: pip install -r apps/api/requirements-dev.txt matplotlib
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu    # CPU build: the tests need no GPU
      - run: python -m pytest tests -q

  web:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm test

  e2e:
    name: Browser tests (the whole product in a real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: apps/api/requirements-dev.txt }
      - run: pip install -r apps/api/requirements-dev.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: apps/web/test-results, retention-days: 7 }

  container:
    name: Docker image builds and the running container passes the deployment check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t prescribble:ci .
      - run: |
          docker run -d --name app -p 8100:8100 -e PRESCRIBBLE_SECRET_KEY="$(openssl rand -hex 32)" -e PRESCRIBBLE_COOKIE_SECURE=false \
            -v ci-data:/data prescribble:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8100/healthz && break; sleep 2; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx websockets
      - run: python scripts/verify_deploy.py http://localhost:8100 --restart-container app
      - if: failure()
        run: docker logs app

  audit:
    name: Known-vulnerability audit of dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install pip-audit && pip-audit -r apps/api/requirements.txt
      - run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high      # moderate findings are reviewed in docs/SECURITY.md
